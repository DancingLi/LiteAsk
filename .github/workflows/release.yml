name: Release LiteAsk (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LiteAsk v__VERSION__"
          releaseBody: |
            ## LiteAsk v__VERSION__

            - 修复 macOS 无法修改全局弹窗快捷键的问题（改用窗口级捕获监听绕过 WKWebView 按钮失焦限制，支持 Option 组合键与中文输入法下的物理键位识别，录制期间暂停旧热键并支持即时生效与冲突提示）
            - 修复 macOS Dock 栏残留图标及点击 Dock / 重新打开 LiteAsk 无响应的问题（增加 `LSUIElement=true` 并监听 `RunEvent::Reopen` 自动唤出偏好设置）
            - 优化设置页底部「版本与自动更新」卡片，检测到新版本后直接在当前区域展示「立即更新并重启」按钮与下载进度条
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
