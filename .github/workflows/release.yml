name: Release LiteAsk (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LiteAsk v__VERSION__"
          releaseBody: |
            ## LiteAsk v__VERSION__

            - 跨平台（macOS Apple Silicon / Intel & Windows）轻量划词翻译、解释与桌面弹窗助手
            - 支持自定义模型供应商（任意 OpenAI 兼容 Base URL + API Key + 模型 ID）
            - 支持按场景自定义模型思考强度（翻译默认关闭思考、解释与弹窗助手可自由配置）
            - 内置自动更新（已安装版本可在「偏好设置 → 版本与自动更新」一键在线升级）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
