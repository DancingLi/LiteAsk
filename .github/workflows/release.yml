name: Release LiteAsk (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LiteAsk v__VERSION__"
          releaseBody: |
            ## LiteAsk v__VERSION__

            - 修复 Windows 11 划词悬浮条弹出后点击页面空白处无法隐藏的问题（配对调用原生 `ShowWindow(SW_HIDE)` 解决 Tauri/tao 可见状态缓存不同步）
            - 优化主线程异步弹出竞态（引入 `dismiss_epoch` 校验）及 Windows 高 DPI 屏防误触拖拽阈值
            - 支持自定义模型供应商、按场景自定义模型思考强度与 GitHub Releases 自动更新
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
