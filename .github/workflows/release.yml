name: Release LiteAsk (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LiteAsk v__VERSION__"
          releaseBody: |
            ## LiteAsk v__VERSION__

            - 修复 macOS 在 `LSUIElement=true` 隐藏 Dock 图标后从「应用程序」或 Spotlight 再次打开 LiteAsk 未唤出窗口的问题（底层注册 `NSAppleEventManager` 的 `kAEReopenApplication` / `kAEOpenApplication` 事件，并自动移动到当前活跃桌面）
            - 修复 macOS 偏好设置窗口不再压住系统设置窗口（恢复 `NSNormalWindowLevel`），方便授权操作
            - 增强 macOS 辅助功能权限引导：新增「重置旧记录」一键按钮（清除升级后失效的旧签名 TCC 缓存并打开系统设置），授权通过后自动通知并刷新设置页状态
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
